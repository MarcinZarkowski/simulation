[project]
name = "simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "yfinance>=0.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "platformdirs>=4.0",
    "pybind11>=3.0.4",
    "scipy>=1.17.1",
    "polars>=1.43.2",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pybind11>=3.0.4",
    "pytest>=9.1.1",
    "setuptools>=84.0.0",
]

[tool.pytest.ini_options]
# Collect only the maintained suite. The repo root still holds scripts from the
# previous implementation that import a module which no longer exists, so an
# unscoped run fails at collection rather than on any real defect.
testpaths = ["tests"]
